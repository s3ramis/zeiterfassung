services:
  postgres:
    image: postgres:17-alpine
    container_name: timepilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: timepilot
      POSTGRES_USER: timepilot
      POSTGRES_PASSWORD: timepilot_dev_password
    ports:
      - "5432:5432"
    volumes:
      - timepilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timepilot -d timepilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  timepilot_postgres_data:
